server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: opspilot-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${DB_URL:jdbc:h2:mem:opspilotdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

opspilot:
  security:
    jwt:
      secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      access-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000} # 15 minutes
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  storage:
    document-path: ${DOCUMENT_STORAGE_PATH:./storage/documents}
  ai:
    provider: ${AI_PROVIDER:mock} # mock or gemini
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${AI_MODEL:gemini-1.5-flash}
      timeout-seconds: ${AI_REQUEST_TIMEOUT:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

---
# Docker / Postgres Profile
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:opspilot}}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:opspilot}
    password: ${DB_PASSWORD:opspilot_secret}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
